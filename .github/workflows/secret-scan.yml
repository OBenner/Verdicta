# Secret Scan — gitleaks scan of the git history.
#
# Verdicta handles third-party agent API keys at runtime, so a leaked
# key in the repository history is a critical incident. This workflow
# scans the full history on every push and PR, plus weekly (new gitleaks
# rules detect previously missed secret types).
#
# Note: GitHub's built-in secret scanning (Settings → Security) should
# also be enabled — it covers pushes in real time and supports push
# protection, which blocks a secret before it even enters the history.

name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1" # weekly, Monday 04:23 UTC

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # post findings as PR comments

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: secrets hide in old commits

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required only if the repo belongs to an organization account
          # (free key at https://gitleaks.io); personal accounts need none.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

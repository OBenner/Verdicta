# CI — single quality gate for Verdicta.
#
# Runs `pnpm verify` (format:check + lint + typecheck + test + build)
# on Linux and Windows. The final `CI Complete` gate job collapses all
# matrix results into a single status check, so branch protection only
# needs to require "CI Complete" and never changes when the matrix grows.

name: CI

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "eslint.config.js"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "eslint.config.js"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        # Version is taken from the packageManager field in package.json.
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify (format, lint, typecheck, test, build)
        run: pnpm verify

  # Gate job: the single check that branch protection requires.
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [verify]
    if: always()
    steps:
      - name: Check all CI jobs passed
        shell: bash
        run: |
          echo "CI job results:"
          echo "  verify: ${{ needs.verify.result }}"

          if [[ "${{ needs.verify.result }}" != "success" ]]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi

          echo "All CI checks passed"

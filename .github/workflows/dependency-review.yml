# Dependency Review — blocks PRs that introduce vulnerable dependencies.
#
# Compares the dependency graph of the PR against the base branch and
# fails if a newly added package has a known vulnerability of HIGH or
# CRITICAL severity (per the GitHub Advisory Database). Complements the
# pnpm-workspace.yaml `allowBuilds` policy: allowBuilds controls which
# packages may run install scripts, this workflow controls which
# packages may enter the lockfile at all.

name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # post the review summary as a PR comment

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

# CodeQL — static security analysis for Verdicta.
#
# Scans TypeScript/JavaScript sources and the GitHub Actions workflows
# themselves (the `actions` language catches misconfigured permissions,
# unpinned actions, script injection, etc.).
#
# Runs on every PR, on pushes to main, and weekly so that newly
# published vulnerability queries are applied to existing code.
# Branch protection should require the "CodeQL Complete" check.

name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/**"
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload results to GitHub code scanning
      actions: read # required for private repos
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  # Gate job: the single check that branch protection requires.
  codeql-complete:
    name: CodeQL Complete
    runs-on: ubuntu-latest
    needs: [analyze]
    if: always()
    steps:
      - name: Check all CodeQL jobs passed
        shell: bash
        run: |
          echo "CodeQL job results:"
          echo "  analyze: ${{ needs.analyze.result }}"

          if [[ "${{ needs.analyze.result }}" != "success" ]]; then
            echo "::error::CodeQL analysis failed"
            exit 1
          fi

          echo "CodeQL analysis passed"
